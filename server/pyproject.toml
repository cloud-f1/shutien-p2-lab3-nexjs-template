[project]
name = "ai-coding-template-server"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    # Framework
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email]>=2.10.4",
    "pydantic-settings>=2.7.1",
    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.1",
    # Auth
    "fastapi-users[sqlalchemy]>=14.0.0",
    "httpx-oauth>=0.16.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Email
    "jinja2>=3.1.0",
    # HTTP client (social login)
    "httpx>=0.28.1",
    "sentry-sdk[fastapi]>=2.54.0",
    "structlog>=24.1.0",
    "stripe>=14.4.1",  # deferred example — billing endpoint not yet implemented (E205)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "anyio[trio]>=4.8.0",
    "factory-boy>=3.3.1",
    "faker>=33.3.1",
    "hypothesis>=6.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "jsonschema>=4.23.0",
    "pip-audit>=2.7.0",
    "schemathesis>=3.36",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "unit: pure unit tests (no DB, no network)",
    "integration: tests requiring DB fixtures",
    "contract: contract tests validating API responses against OpenAPI schema",
    "smoke: critical-path quick tests for deployment validation",
    "regression: bug regression tests (paired with bugfix-log)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
