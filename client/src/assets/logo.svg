<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd060"/>
      <stop offset="100%" stop-color="#e09400"/>
    </linearGradient>
  </defs>

  <!-- Outer hex -->
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22"
    fill="url(#g1)"/>

  <!-- Inner dark hex -->
  <polygon points="40,13 63,26.5 63,53.5 40,67 17,53.5 17,26.5"
    fill="#0d0a04"/>

  <!-- 3 minimal lines from center -->
  <g stroke="#f0a500" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="40" x2="40" y2="25"/>
    <line x1="40" y1="40" x2="53" y2="47.5"/>
    <line x1="40" y1="40" x2="27" y2="47.5"/>
  </g>

  <!-- 3 terminal dots -->
  <circle cx="40"  cy="25"  r="3" fill="#ffc233"/>
  <circle cx="53"  cy="47.5" r="3" fill="#ffc233"/>
  <circle cx="27"  cy="47.5" r="3" fill="#ffc233"/>

  <!-- Center dot -->
  <circle cx="40" cy="40" r="4.5" fill="#f0a500"/>
  <circle cx="40" cy="40" r="2"   fill="#fffbe8"/>
</svg>
