repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: migration-linter
        name: migration-linter
        entry: bash -c 'cd server && uv run pytest tests/test_migration_lint.py -q --no-header'
        language: system
        files: ^server/alembic/versions/.*\.py$
        pass_filenames: false
