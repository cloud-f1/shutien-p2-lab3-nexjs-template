# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Next.js SaaS Starter
spec:
  description: |
    Next.js 16 SaaS starter — App Router + Auth.js v5 + Drizzle ORM + PostgreSQL.
    A single web service (no API/client split) backed by a managed PostgreSQL.
  icon: null
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: App Domain
      description: The public domain for the Next.js app.
  tags:
    - SaaS
    - Next.js
    - Template
  readme: |-
    # Next.js SaaS Starter

    A single-service Next.js app (App Router + Auth.js v5 + Drizzle ORM)
    backed by a managed PostgreSQL.

    ## Services

    - **web**: Next.js (node:22-alpine, `.next/standalone` output)
    - **postgresql**: Managed PostgreSQL database

    ## Post-Deploy

    1. `AUTH_SECRET` — set a strong random value (`openssl rand -base64 32`).
    2. `AUTH_URL` + `NEXT_PUBLIC_APP_URL` — set to your deploy domain (with `https://`).
       `NEXT_PUBLIC_APP_URL` is baked at BUILD time — redeploy after changing it.
    3. Set `NEXT_PUBLIC_ENABLE_DEMO_LOGIN=false` for production.
    4. Run migrations once: `zeabur exec --service web -- pnpm db:migrate`.

  services:
    # ── PostgreSQL ─────────────────────────────────────────────────────
    - name: postgresql
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/postgresql.svg
      template: PREBUILT
      spec:
        source:
          image: postgres:16-alpine
        ports:
          - id: database
            port: 5432
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/postgresql/data
        env:
          PGDATA:
            default: /var/lib/postgresql/data/pgdata
          POSTGRES_DB:
            default: saas
          POSTGRES_USER:
            default: saas_user
          POSTGRES_PASSWORD:
            default: ${PASSWORD}
            expose: true
          POSTGRES_USERNAME:
            default: ${POSTGRES_USER}
            expose: true
            readonly: true
          POSTGRES_DATABASE:
            default: ${POSTGRES_DB}
            expose: true
            readonly: true
          POSTGRES_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
            readonly: true
          POSTGRES_PORT:
            default: ${DATABASE_PORT}
            expose: true
            readonly: true
          POSTGRES_CONNECTION_STRING:
            default: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
            expose: true
            readonly: true
        configs:
          - path: /etc/postgresql/postgresql.conf
            template: |
              listen_addresses = '*'
              max_connections = 100
              shared_buffers = 128MB
              dynamic_shared_memory_type = posix
              max_wal_size = 1GB
              min_wal_size = 80MB
              log_timezone = 'Etc/UTC'
              datestyle = 'iso, mdy'
              timezone = 'Etc/UTC'
              lc_messages = 'en_US.utf8'
              lc_monetary = 'en_US.utf8'
              lc_numeric = 'en_US.utf8'
              lc_time = 'en_US.utf8'
              default_text_search_config = 'pg_catalog.english'
        healthCheck:
          type: TCP
          port: database
        instructions:
          - type: TEXT
            title: Connection String
            content: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${PORT_FORWARDED_HOSTNAME}:${DATABASE_PORT_FORWARDED_PORT}/${POSTGRES_DATABASE}
          - type: TEXT
            title: PostgreSQL username
            content: ${POSTGRES_USERNAME}
            category: Credentials
          - type: PASSWORD
            title: PostgreSQL password
            content: ${POSTGRES_PASSWORD}
            category: Credentials

    # ── web (Next.js) ──────────────────────────────────────────────────
    - name: web
      icon: https://raw.githubusercontent.com/zeabur/service-icons/refs/heads/main/git/nodejs/nextjs.svg
      dependencies:
        - postgresql
      template: GIT
      spec:
        source:
          # Build the Dockerfile in next-app/ directly from the connected Git repo.
          rootDirectory: next-app
        ports:
          - id: web
            port: 3000
            type: HTTP
        env:
          # ── Runtime (read on start; restart is enough to update) ──
          DATABASE_URL:
            default: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
          AUTH_SECRET:
            default: ${PASSWORD}
          AUTH_URL:
            default: https://${PUBLIC_DOMAIN}
            expose: true
          AUTH_TRUST_HOST:
            default: "true"
          NODE_ENV:
            default: production
          NEXT_TELEMETRY_DISABLED:
            default: "1"
          # ── Build-time NEXT_PUBLIC_* (baked into the bundle — redeploy to change) ──
          NEXT_PUBLIC_APP_URL:
            default: https://${PUBLIC_DOMAIN}
            expose: true
          NEXT_PUBLIC_ENABLE_DEMO_LOGIN:
            default: "false"
          # ── Email (SMTP) — set in the dashboard ──
          SMTP_HOST:
            default: ""
          SMTP_PORT:
            default: "587"
          SMTP_USER:
            default: ""
          SMTP_PASS:
            default: ""
          EMAIL_FROM:
            default: noreply@example.com
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /
      domainKey: PUBLIC_DOMAIN
