SessionRead:
  type: object
  required: [id, device_info, created_at, expires_at, is_current]
  properties:
    id:
      type: string
      format: uuid
    device_info:
      type: string
      description: User-Agent or device identifier
    ip_address:
      type: ['string', 'null']
      description: IP address at session creation
    created_at:
      type: string
      format: date-time
    last_used_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    is_current:
      type: boolean
      description: Whether this session matches the current request
