AdminHealthResponse:
  type: object
  required: [db, email, oauth, app]
  properties:
    db:
      type: object
      required: [status, latency_ms]
      properties:
        status:
          type: string
          enum: [connected, disconnected]
        latency_ms:
          type: number
          description: Database ping latency in milliseconds
    email:
      type: object
      required: [provider, configured]
      properties:
        provider:
          type: string
          description: Email provider name (e.g. console, mailgun, zeabur)
        configured:
          type: boolean
          description: Whether the email provider is properly configured
    oauth:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: string
          description: List of configured OAuth provider names
    app:
      type: object
      required: [version, uptime_seconds, environment]
      properties:
        version:
          type: string
          example: 1.0.0
        uptime_seconds:
          type: number
          description: Process uptime in seconds
        environment:
          type: string
          example: development

EndpointSli:
  type: object
  required: [path, count, success_rate, p50_ms, p95_ms]
  properties:
    path:
      type: string
      description: Normalised endpoint path (id segments collapsed to {id})
    count:
      type: integer
    success_rate:
      type: number
      minimum: 0
      maximum: 1
    p50_ms:
      type: number
    p95_ms:
      type: number

DbPoolStats:
  type: object
  required: [size, checked_in, checked_out, overflow]
  properties:
    size:
      type: integer
      description: Pool capacity (-1 if unsupported, e.g. SQLite)
    checked_in:
      type: integer
    checked_out:
      type: integer
      description: Active connections
    overflow:
      type: integer

SliResponse:
  type: object
  required:
    - window_seconds
    - sample_count
    - success_rate_5m
    - p50_ms
    - p95_ms
    - top_endpoints
    - db_pool
    - release
    - environment
  properties:
    window_seconds:
      type: integer
      description: Trailing window in seconds (default 300)
    sample_count:
      type: integer
    success_rate_5m:
      type: number
      minimum: 0
      maximum: 1
    p50_ms:
      type: number
    p95_ms:
      type: number
    top_endpoints:
      type: array
      items:
        $ref: '#/EndpointSli'
    db_pool:
      $ref: '#/DbPoolStats'
    release:
      type: string
      description: GIT_SHA at deploy time (or "unknown")
    environment:
      type: string
