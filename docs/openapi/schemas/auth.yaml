UserRead:
  type: object
  required: [id, email, is_active, is_verified, is_superuser]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    display_name:
      type: ['string', 'null']
    avatar_url:
      type: ['string', 'null']
      format: uri
    is_active:
      type: boolean
    is_verified:
      type: boolean
    is_superuser:
      type: boolean
    social_providers:
      type: array
      items:
        type: string
        enum: [google, apple]
      default: []
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

UserCreate:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 8
    display_name:
      type: string
      maxLength: 100
    is_active:
      type: boolean
      default: true
    is_verified:
      type: boolean
      default: false
    is_superuser:
      type: boolean
      default: false

UserUpdate:
  type: object
  properties:
    password:
      type: string
    email:
      type: string
      format: email
    display_name:
      type: ['string', 'null']
      maxLength: 100
    avatar_url:
      type: ['string', 'null']
      format: uri
    is_active:
      type: boolean
    is_verified:
      type: boolean
    is_superuser:
      type: boolean

BearerResponse:
  type: object
  required: [access_token, refresh_token, token_type]
  properties:
    access_token:
      type: string
      description: JWT access token (15 min TTL)
    refresh_token:
      type: string
      description: JWT refresh token (30 day TTL, rotate on use)
    token_type:
      type: string
      enum: [bearer]

AuthResponse:
  type: object
  required: [user, access_token, refresh_token, token_type, expires_in]
  description: >
    Unified auth payload (E161) returned by /auth/register, /auth/jwt/login,
    and /auth/refresh. Replaces the legacy adapter that composed user + tokens
    on the client.
  properties:
    user:
      $ref: '#/UserRead'
    access_token:
      type: string
    refresh_token:
      type: string
    token_type:
      type: string
      enum: [bearer]
    expires_in:
      type: integer
      description: Access token TTL in seconds
      example: 900

UserSessionRead:
  type: object
  required: [id, created_at, last_used_at]
  description: Active session row from the user_sessions store (E161).
  properties:
    id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    last_used_at:
      type: string
      format: date-time
    ip:
      type: ['string', 'null']
    user_agent:
      type: ['string', 'null']

RefreshTokenRequest:
  type: object
  required: [refresh_token]
  properties:
    refresh_token:
      type: string

ForgotPasswordRequest:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email

ResetPasswordRequest:
  type: object
  required: [token, password]
  properties:
    token:
      type: string
    password:
      type: string
