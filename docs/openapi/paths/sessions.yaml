list:
  get:
    tags: [users]
    summary: List active sessions for current user
    operationId: listSessions
    responses:
      '200':
        description: Active sessions
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/session.yaml#/SessionRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'

revoke:
  delete:
    tags: [users]
    summary: Revoke a specific session (single-device logout)
    operationId: revokeSession
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Session revoked
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: Session not found
