google-authorize:
  get:
    tags: [auth]
    summary: Google OAuth2 redirect
    operationId: authGoogleAuthorize
    security: []
    responses:
      '200':
        description: Returns authorization URL
        content:
          application/json:
            schema:
              type: object
              properties:
                authorization_url:
                  type: string
                  format: uri

google-callback:
  get:
    tags: [auth]
    summary: Google OAuth2 callback
    operationId: authGoogleCallback
    security: []
    parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
    responses:
      '200':
        description: OAuth login successful
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/BearerResponse'

