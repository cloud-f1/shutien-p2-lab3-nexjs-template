register:
  post:
    tags: [auth]
    summary: Create account
    operationId: authRegister
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/UserCreate'
    responses:
      '201':
        description: Account created — returns user + token pair (E161 unified shape)
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'
      '400':
        description: User already exists
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
            example:
              detail: REGISTER_USER_ALREADY_EXISTS
      '422':
        $ref: '../schemas/common.yaml#/responses/ValidationError'

login:
  post:
    tags: [auth]
    summary: Login (OAuth2 password flow)
    operationId: authLogin
    security: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [username, password]
            properties:
              username:
                type: string
                description: Email address
              password:
                type: string
    responses:
      '200':
        description: Login successful — returns user + token pair (E161 unified shape)
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'
      '400':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
            example:
              detail: LOGIN_BAD_CREDENTIALS

logout:
  post:
    tags: [auth]
    summary: Logout (stateless — client discards token)
    operationId: authLogout
    responses:
      '204':
        description: Logged out
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'

refresh:
  post:
    tags: [auth]
    summary: Refresh access token using refresh token
    operationId: authRefresh
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/RefreshTokenRequest'
    responses:
      '200':
        description: New token pair (E161 unified shape — user + tokens)
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'
      '401':
        description: Invalid, expired, or revoked refresh token (reuse → entire family revoked)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
            example:
              detail: INVALID_REFRESH_TOKEN

forgot-password:
  post:
    tags: [auth]
    summary: Request password reset (always returns 202)
    operationId: authForgotPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/ForgotPasswordRequest'
    responses:
      '202':
        description: Accepted (never reveals email existence)

reset-password:
  post:
    tags: [auth]
    summary: Reset password with token
    operationId: authResetPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/ResetPasswordRequest'
    responses:
      '200':
        description: Password reset successful
      '400':
        description: Bad token
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
            example:
              detail: RESET_PASSWORD_BAD_TOKEN

request-verify-token:
  post:
    tags: [auth]
    summary: Request email verification token
    operationId: authRequestVerifyToken
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
    responses:
      '202':
        description: Accepted

sessions:
  get:
    tags: [auth]
    summary: List active sessions for current user (E161)
    operationId: authListSessions
    responses:
      '200':
        description: Active (non-revoked) sessions for the authenticated user
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/auth.yaml#/UserSessionRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'

session-by-id:
  delete:
    tags: [auth]
    summary: Revoke a specific session (E161)
    operationId: authRevokeSession
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Session revoked
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: Session not found or not owned by current user

logout-all:
  post:
    tags: [auth]
    summary: Revoke all sessions for the current user (E161 sign-out-everywhere)
    operationId: authLogoutAll
    responses:
      '204':
        description: All sessions revoked in a single transaction
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'

verify:
  post:
    tags: [auth]
    summary: Verify email with token
    operationId: authVerify
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
    responses:
      '200':
        description: Email verified
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/UserRead'
      '400':
        description: Bad token
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
            example:
              detail: VERIFY_USER_BAD_TOKEN
