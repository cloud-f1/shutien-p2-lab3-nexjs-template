<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" fill="none">
  <style>
    .step { fill: #0e0e1a; stroke: #f0a500; stroke-width: 2; }
    .active { fill: #f0a500; }
    .step-label { fill: #f0f0f8; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .cmd { fill: #ffc233; font-family: monospace; font-size: 11px; text-anchor: middle; }
    .arrow-line { stroke: #f0a500; stroke-width: 2; fill: none; }
    .arrow-head { fill: #f0a500; }
    .num { fill: #07070f; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 800; text-anchor: middle; }
  </style>
  <!-- Step 1: spec -->
  <g transform="translate(60,80)">
    <rect class="step" width="140" height="70" rx="8"/>
    <circle class="active" cx="70" cy="-8" r="14"/>
    <text class="num" x="70" y="-3">1</text>
    <text class="step-label" x="70" y="32">spec</text>
    <text class="cmd" x="70" y="52">/athena:spec</text>
  </g>
  <!-- Arrow -->
  <line class="arrow-line" x1="200" y1="115" x2="230" y2="115"/>
  <polygon class="arrow-head" points="228,110 238,115 228,120"/>
  <!-- Step 2 -->
  <g transform="translate(240,80)">
    <rect class="step" width="140" height="70" rx="8"/>
    <circle class="active" cx="70" cy="-8" r="14"/>
    <text class="num" x="70" y="-3">2</text>
    <text class="step-label" x="70" y="32">implement</text>
    <text class="cmd" x="70" y="52">/athena:implement</text>
  </g>
  <line class="arrow-line" x1="380" y1="115" x2="410" y2="115"/>
  <polygon class="arrow-head" points="408,110 418,115 408,120"/>
  <!-- Step 3 -->
  <g transform="translate(420,80)">
    <rect class="step" width="140" height="70" rx="8"/>
    <circle class="active" cx="70" cy="-8" r="14"/>
    <text class="num" x="70" y="-3">3</text>
    <text class="step-label" x="70" y="32">qa</text>
    <text class="cmd" x="70" y="52">/athena:qa</text>
  </g>
  <line class="arrow-line" x1="560" y1="115" x2="590" y2="115"/>
  <polygon class="arrow-head" points="588,110 598,115 588,120"/>
  <!-- Step 4 -->
  <g transform="translate(600,80)">
    <rect class="step" width="140" height="70" rx="8"/>
    <circle class="active" cx="70" cy="-8" r="14"/>
    <text class="num" x="70" y="-3">4</text>
    <text class="step-label" x="70" y="32">commit</text>
    <text class="cmd" x="70" y="52">git commit</text>
  </g>
  <line class="arrow-line" x1="740" y1="115" x2="770" y2="115"/>
  <polygon class="arrow-head" points="768,110 778,115 768,120"/>
  <!-- Step 5 -->
  <g transform="translate(780,80)">
    <rect class="step" width="140" height="70" rx="8"/>
    <circle class="active" cx="70" cy="-8" r="14"/>
    <text class="num" x="70" y="-3">5</text>
    <text class="step-label" x="70" y="32">merge</text>
    <text class="cmd" x="70" y="52">/athena:pr</text>
  </g>
</svg>
