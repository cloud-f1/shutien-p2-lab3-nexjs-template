PlaceCreate:
  type: object
  required: [name, latitude, longitude]
  properties:
    name:
      type: string
      maxLength: 200
    address:
      type: string
      maxLength: 500
    description:
      type: string
      maxLength: 2000
    latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
    longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
    category:
      type: string
      maxLength: 50

PlaceRead:
  type: object
  required: [id, name, latitude, longitude, user_id, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    address:
      type: ['string', 'null']
    description:
      type: ['string', 'null']
    latitude:
      type: number
      format: double
    longitude:
      type: number
      format: double
    category:
      type: ['string', 'null']
    user_id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PlaceUpdate:
  type: object
  properties:
    name:
      type: string
      maxLength: 200
    address:
      type: ['string', 'null']
      maxLength: 500
    description:
      type: ['string', 'null']
      maxLength: 2000
    latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
    longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
    category:
      type: ['string', 'null']
      maxLength: 50

PaginatedPlaceResponse:
  type: object
  required: [items, total, page, page_size, pages]
  properties:
    items:
      type: array
      items:
        $ref: '#/PlaceRead'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
    pages:
      type: integer
