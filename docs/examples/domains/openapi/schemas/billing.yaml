SubscriptionStatus:
  type: string
  enum: [active, past_due, canceled, incomplete, trialing, unpaid, paused, free]
  description: >
    Subscription lifecycle status. Maps to Stripe statuses plus 'free'
    for teams without a paid subscription.

PlanRead:
  type: object
  required: [id, name, slug, stripe_price_id, amount, currency, interval, features, is_active, display_order]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      description: Display name (e.g. "Pro", "Enterprise")
    slug:
      type: string
      description: URL-safe identifier (e.g. "pro", "enterprise")
    stripe_price_id:
      type: string
      description: Stripe Price ID (price_xxx)
    amount:
      type: integer
      description: Price in smallest currency unit (cents)
    currency:
      type: string
      default: usd
      description: ISO 4217 currency code
    interval:
      type: string
      enum: [month, year]
      description: Billing interval
    features:
      type: object
      additionalProperties: true
      description: >
        Feature flags and limits for this plan.
        Example: {"max_members": 5, "max_places": 100, "analytics": true}
    limits:
      type: object
      additionalProperties: true
      description: >
        Numeric limits for quota enforcement.
        Example: {"max_members": 5, "max_places": 100, "max_portfolios": 10}
    is_active:
      type: boolean
      description: Whether this plan is available for new subscriptions
    display_order:
      type: integer
      description: Sort order for pricing page display

SubscriptionRead:
  type: object
  required: [team_id, status, plan]
  properties:
    id:
      type: ['string', 'null']
      format: uuid
      description: Null for free tier (no subscription record)
    team_id:
      type: string
      format: uuid
    status:
      $ref: '#/SubscriptionStatus'
    plan:
      $ref: '#/PlanRead'
      description: Current plan (free tier plan if no subscription)
    stripe_subscription_id:
      type: ['string', 'null']
      description: Stripe Subscription ID (sub_xxx)
    stripe_customer_id:
      type: ['string', 'null']
      description: Stripe Customer ID (cus_xxx)
    current_period_start:
      type: ['string', 'null']
      format: date-time
    current_period_end:
      type: ['string', 'null']
      format: date-time
    cancel_at_period_end:
      type: boolean
      default: false
      description: Whether subscription cancels at period end
    created_at:
      type: ['string', 'null']
      format: date-time
    updated_at:
      type: ['string', 'null']
      format: date-time

CheckoutSessionCreate:
  type: object
  required: [team_id, plan_id]
  properties:
    team_id:
      type: string
      format: uuid
    plan_id:
      type: string
      format: uuid
      description: The plan to subscribe to
    success_url:
      type: string
      format: uri
      description: Redirect URL after successful checkout (defaults to dashboard)
    cancel_url:
      type: string
      format: uri
      description: Redirect URL if user cancels checkout (defaults to pricing page)

CheckoutSessionRead:
  type: object
  required: [checkout_url, session_id]
  properties:
    checkout_url:
      type: string
      format: uri
      description: Stripe Checkout URL — redirect the user here
    session_id:
      type: string
      description: Stripe Checkout Session ID (cs_xxx)

PortalSessionCreate:
  type: object
  required: [team_id]
  properties:
    team_id:
      type: string
      format: uuid
    return_url:
      type: string
      format: uri
      description: URL to return to after portal session (defaults to billing page)

PortalSessionRead:
  type: object
  required: [portal_url]
  properties:
    portal_url:
      type: string
      format: uri
      description: Stripe Customer Portal URL — redirect the user here
