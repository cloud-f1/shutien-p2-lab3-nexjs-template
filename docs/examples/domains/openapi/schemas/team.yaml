TeamRole:
  type: string
  enum: [viewer, editor, admin, owner]
  description: >
    Role hierarchy: viewer < editor < admin < owner.
    viewer=read-only, editor=read+write resources,
    admin=manage members+resources, owner=full control.

TeamCreate:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 100
      description: URL-safe slug (auto-generated from name if omitted)

TeamRead:
  type: object
  required: [id, name, slug, member_count, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    member_count:
      type: integer
      description: Number of members in this team
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

TeamReadWithRole:
  type: object
  required: [id, name, slug, member_count, my_role, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    member_count:
      type: integer
    my_role:
      $ref: '#/TeamRole'
      description: The current user's role in this team
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

TeamUpdate:
  type: object
  properties:
    name:
      type: string
      maxLength: 100
    slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 100

TeamMemberCreate:
  type: object
  required: [user_id, role]
  properties:
    user_id:
      type: string
      format: uuid
    role:
      $ref: '#/TeamRole'

TeamMemberRead:
  type: object
  required: [id, team_id, user_id, role, user, created_at]
  properties:
    id:
      type: string
      format: uuid
    team_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    role:
      $ref: '#/TeamRole'
    user:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: ['string', 'null']
        avatar_url:
          type: ['string', 'null']
          format: uri
      description: Embedded user summary (not full UserRead)
    created_at:
      type: string
      format: date-time

TeamMemberUpdate:
  type: object
  required: [role]
  properties:
    role:
      $ref: '#/TeamRole'
