PortfolioCreate:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      maxLength: 2000

PortfolioRead:
  type: object
  required: [id, name, user_id, place_count, total_value, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: ['string', 'null']
    user_id:
      type: string
      format: uuid
    place_count:
      type: integer
      description: Number of places in this portfolio
    total_value:
      type: string
      format: decimal
      description: Sum of current_value across all places
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PortfolioDetail:
  type: object
  required: [id, name, user_id, place_count, total_value, total_purchase, gain_loss, gain_loss_pct, places, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: ['string', 'null']
    user_id:
      type: string
      format: uuid
    place_count:
      type: integer
    total_value:
      type: string
      format: decimal
    total_purchase:
      type: string
      format: decimal
      description: Sum of purchase_price across all places
    gain_loss:
      type: string
      format: decimal
      description: total_value - total_purchase
    gain_loss_pct:
      type: ['string', 'null']
      format: decimal
      description: Percentage gain/loss (null if total_purchase is 0)
    places:
      type: array
      items:
        $ref: '#/PortfolioPlaceRead'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PortfolioUpdate:
  type: object
  properties:
    name:
      type: string
      maxLength: 200
    description:
      type: ['string', 'null']
      maxLength: 2000

PaginatedPortfolioResponse:
  type: object
  required: [items, total, page, page_size, pages]
  properties:
    items:
      type: array
      items:
        $ref: '#/PortfolioRead'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
    pages:
      type: integer

PortfolioPlaceCreate:
  type: object
  required: [place_id]
  properties:
    place_id:
      type: string
      format: uuid
    purchase_price:
      type: string
      format: decimal
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      default: '0.00'
      description: Max 9999999999.99
    current_value:
      type: string
      format: decimal
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      default: '0.00'
      description: Max 9999999999.99
    notes:
      type: string
      maxLength: 1000

PortfolioPlaceRead:
  type: object
  required: [portfolio_id, place_id, purchase_price, current_value, added_at, place]
  properties:
    portfolio_id:
      type: string
      format: uuid
    place_id:
      type: string
      format: uuid
    purchase_price:
      type: string
      format: decimal
    current_value:
      type: string
      format: decimal
    gain_loss:
      type: string
      format: decimal
      description: current_value - purchase_price
    notes:
      type: ['string', 'null']
    added_at:
      type: string
      format: date-time
    place:
      $ref: './place.yaml#/PlaceRead'
      description: Embedded place data

PortfolioPlaceUpdate:
  type: object
  properties:
    purchase_price:
      type: string
      format: decimal
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      description: Max 9999999999.99
    current_value:
      type: string
      format: decimal
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      description: Max 9999999999.99
    notes:
      type: ['string', 'null']
      maxLength: 1000

PortfolioAnalytics:
  type: object
  required: [portfolio_id, total_value, total_purchase, gain_loss, gain_loss_pct, place_count, category_allocation, top_performers]
  properties:
    portfolio_id:
      type: string
      format: uuid
    total_value:
      type: string
      format: decimal
    total_purchase:
      type: string
      format: decimal
    gain_loss:
      type: string
      format: decimal
    gain_loss_pct:
      type: ['string', 'null']
      format: decimal
    place_count:
      type: integer
    category_allocation:
      type: array
      items:
        type: object
        required: [category, count, value, percentage]
        properties:
          category:
            type: string
          count:
            type: integer
          value:
            type: string
            format: decimal
          percentage:
            type: string
            format: decimal
            description: Percentage of total_value
    top_performers:
      type: array
      items:
        type: object
        required: [place_id, place_name, gain_loss, gain_loss_pct]
        properties:
          place_id:
            type: string
            format: uuid
          place_name:
            type: string
          purchase_price:
            type: string
            format: decimal
          current_value:
            type: string
            format: decimal
          gain_loss:
            type: string
            format: decimal
          gain_loss_pct:
            type: ['string', 'null']
            format: decimal
