collection:
  post:
    tags: [places]
    summary: Create a place
    operationId: createPlace
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/place.yaml#/PlaceCreate'
    responses:
      '201':
        description: Place created
        content:
          application/json:
            schema:
              $ref: '../schemas/place.yaml#/PlaceRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '422':
        $ref: '../schemas/common.yaml#/responses/ValidationError'
  get:
    tags: [places]
    summary: List current user's places (paginated)
    operationId: listPlaces
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    responses:
      '200':
        description: Paginated list of places
        content:
          application/json:
            schema:
              $ref: '../schemas/place.yaml#/PaginatedPlaceResponse'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'

nearby:
  get:
    tags: [places]
    summary: Find places near a coordinate
    operationId: nearbyPlaces
    parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: radius_km
        in: query
        schema:
          type: number
          format: double
          default: 10
          maximum: 100
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      '200':
        description: Places within radius
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/place.yaml#/PlaceRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'

item:
  get:
    tags: [places]
    summary: Get a place by ID
    operationId: getPlace
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Place details
        content:
          application/json:
            schema:
              $ref: '../schemas/place.yaml#/PlaceRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: Place not found
  patch:
    tags: [places]
    summary: Update a place
    operationId: updatePlace
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/place.yaml#/PlaceUpdate'
    responses:
      '200':
        description: Place updated
        content:
          application/json:
            schema:
              $ref: '../schemas/place.yaml#/PlaceRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: Place not found
      '422':
        $ref: '../schemas/common.yaml#/responses/ValidationError'
  delete:
    tags: [places]
    summary: Delete a place
    operationId: deletePlace
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Place deleted
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: Place not found
