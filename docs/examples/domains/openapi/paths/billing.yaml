plans:
  get:
    tags: [billing]
    summary: List available subscription plans
    operationId: listPlans
    security: []
    responses:
      '200':
        description: Available plans
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/billing.yaml#/PlanRead'

checkout:
  post:
    tags: [billing]
    summary: Create a Stripe Checkout session for a team
    operationId: createCheckoutSession
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/billing.yaml#/CheckoutSessionCreate'
    responses:
      '200':
        description: Checkout session created
        content:
          application/json:
            schema:
              $ref: '../schemas/billing.yaml#/CheckoutSessionRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '403':
        description: Insufficient role (requires admin or owner)
      '404':
        description: Team or plan not found
      '409':
        description: Team already has an active subscription
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
            example:
              detail: SUBSCRIPTION_ALREADY_ACTIVE
      '422':
        $ref: '../schemas/common.yaml#/responses/ValidationError'

portal:
  post:
    tags: [billing]
    summary: Create a Stripe Customer Portal session
    operationId: createPortalSession
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/billing.yaml#/PortalSessionCreate'
    responses:
      '200':
        description: Portal session created
        content:
          application/json:
            schema:
              $ref: '../schemas/billing.yaml#/PortalSessionRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '403':
        description: Insufficient role (requires admin or owner)
      '404':
        description: Team not found or no Stripe customer
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
            example:
              detail: NO_STRIPE_CUSTOMER

subscription:
  get:
    tags: [billing]
    summary: Get current subscription for a team
    operationId: getSubscription
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Current subscription (or free tier if none)
        content:
          application/json:
            schema:
              $ref: '../schemas/billing.yaml#/SubscriptionRead'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '403':
        description: Not a member of this team
      '404':
        description: Team not found

webhook:
  post:
    tags: [billing]
    summary: Stripe webhook endpoint (called by Stripe, not by clients)
    operationId: stripeWebhook
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Raw Stripe event payload (verified via signature)
    responses:
      '200':
        description: Webhook processed
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok]
      '400':
        description: Invalid signature or payload
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorDetail'
