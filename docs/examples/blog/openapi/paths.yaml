## Post domain — OpenAPI path definitions

/posts:
  get:
    tags:
      - posts
    summary: List posts
    operationId: list_posts
    security:
      - BearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: published
        in: query
        description: Filter by publish status (true=published, false=draft, omit=all)
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: Paginated list of posts
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginatedPostResponse"
      "401":
        description: Unauthorized

  post:
    tags:
      - posts
    summary: Create post
    operationId: create_post
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PostCreate"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRead"
      "401":
        description: Unauthorized
      "422":
        description: Validation error

/posts/{post_id}:
  get:
    tags:
      - posts
    summary: Get post by ID
    operationId: get_post
    security:
      - BearerAuth: []
    parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Post detail
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRead"
      "401":
        description: Unauthorized
      "404":
        description: Not found

  patch:
    tags:
      - posts
    summary: Update post
    operationId: update_post
    security:
      - BearerAuth: []
    parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PostUpdate"
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRead"
      "401":
        description: Unauthorized
      "404":
        description: Not found
      "422":
        description: Validation error

  delete:
    tags:
      - posts
    summary: Delete post
    operationId: delete_post
    security:
      - BearerAuth: []
    parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Deleted
      "401":
        description: Unauthorized
      "404":
        description: Not found
