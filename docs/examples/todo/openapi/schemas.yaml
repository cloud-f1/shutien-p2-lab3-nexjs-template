## Task domain — OpenAPI schema definitions

TaskCreate:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      maxLength: 200
    description:
      type: string
      maxLength: 2000
    completed:
      type: boolean
      default: false
    due_date:
      type: string
      format: date-time
    priority:
      type: integer
      minimum: 0
      maximum: 2
      default: 0

TaskRead:
  type: object
  required:
    - id
    - title
    - completed
    - priority
    - is_overdue
    - user_id
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    description:
      type: string
      nullable: true
    completed:
      type: boolean
    due_date:
      type: string
      format: date-time
      nullable: true
    priority:
      type: integer
    is_overdue:
      type: boolean
      description: "Computed: true when due_date < now AND not completed"
    user_id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

TaskUpdate:
  type: object
  properties:
    title:
      type: string
      maxLength: 200
    description:
      type: string
      maxLength: 2000
    completed:
      type: boolean
    due_date:
      type: string
      format: date-time
    priority:
      type: integer
      minimum: 0
      maximum: 2

TaskBatchUpdate:
  type: object
  required:
    - task_ids
    - completed
  properties:
    task_ids:
      type: array
      items:
        type: string
        format: uuid
      minItems: 1
      maxItems: 100
    completed:
      type: boolean

PaginatedTaskResponse:
  type: object
  required:
    - items
    - total
    - page
    - page_size
    - pages
  properties:
    items:
      type: array
      items:
        $ref: "#/components/schemas/TaskRead"
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
    pages:
      type: integer
