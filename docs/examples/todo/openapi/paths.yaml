## Task domain — OpenAPI path definitions

/tasks:
  get:
    tags:
      - tasks
    summary: List tasks
    operationId: list_tasks
    security:
      - BearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: completed
        in: query
        description: Filter by completion status (true=done, false=pending, omit=all)
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: Paginated list of tasks (sorted by priority DESC, due_date ASC)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginatedTaskResponse"
      "401":
        description: Unauthorized

  post:
    tags:
      - tasks
    summary: Create task
    operationId: create_task
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskCreate"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRead"
      "401":
        description: Unauthorized
      "422":
        description: Validation error

/tasks/{task_id}:
  get:
    tags:
      - tasks
    summary: Get task by ID
    operationId: get_task
    security:
      - BearerAuth: []
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Task detail (includes is_overdue computed field)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRead"
      "401":
        description: Unauthorized
      "404":
        description: Not found

  patch:
    tags:
      - tasks
    summary: Update task
    operationId: update_task
    security:
      - BearerAuth: []
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskUpdate"
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRead"
      "401":
        description: Unauthorized
      "404":
        description: Not found
      "422":
        description: Validation error

  delete:
    tags:
      - tasks
    summary: Delete task
    operationId: delete_task
    security:
      - BearerAuth: []
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Deleted
      "401":
        description: Unauthorized
      "404":
        description: Not found

/tasks/batch:
  patch:
    tags:
      - tasks
    summary: Batch update task completion status
    operationId: batch_update_tasks
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskBatchUpdate"
    responses:
      "200":
        description: Number of tasks updated
        content:
          application/json:
            schema:
              type: object
              properties:
                updated:
                  type: integer
      "401":
        description: Unauthorized
      "422":
        description: Validation error
