## Contact domain — OpenAPI path definitions

/contacts:
  get:
    tags:
      - contacts
    summary: List contacts
    operationId: list_contacts
    security:
      - BearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: q
        in: query
        description: Search keyword — matches name, email, or company (case-insensitive)
        required: false
        schema:
          type: string
          maxLength: 200
    responses:
      "200":
        description: Paginated list of contacts
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaginatedContactResponse"
      "401":
        description: Unauthorized

  post:
    tags:
      - contacts
    summary: Create contact
    operationId: create_contact
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactCreate"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRead"
      "401":
        description: Unauthorized
      "422":
        description: Validation error

/contacts/{contact_id}:
  get:
    tags:
      - contacts
    summary: Get contact by ID
    operationId: get_contact
    security:
      - BearerAuth: []
    parameters:
      - name: contact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Contact detail (includes full notes)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRead"
      "401":
        description: Unauthorized
      "404":
        description: Not found

  patch:
    tags:
      - contacts
    summary: Update contact
    operationId: update_contact
    security:
      - BearerAuth: []
    parameters:
      - name: contact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactUpdate"
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRead"
      "401":
        description: Unauthorized
      "404":
        description: Not found
      "422":
        description: Validation error

  delete:
    tags:
      - contacts
    summary: Delete contact
    operationId: delete_contact
    security:
      - BearerAuth: []
    parameters:
      - name: contact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Deleted
      "401":
        description: Unauthorized
      "404":
        description: Not found
