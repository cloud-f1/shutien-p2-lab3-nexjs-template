openapi: 3.1.0
info:
  title: SaaS Starter API
  description: |
    REST API for the Next.js SaaS starter template.
    - Auth endpoints are served by Auth.js v5 at `/api/auth/*`
    - Admin and user management endpoints are Next.js Route Handlers
    - Most mutations use Server Actions (not REST) — only browser-facing REST routes are documented here
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: your-domain.com

tags:
  - name: auth
    description: Authentication (Auth.js v5 managed endpoints)
  - name: users
    description: User profile management
  - name: admin
    description: Admin-only user management (requires role=admin)
  - name: health
    description: Health checks

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: Auth.js session cookie (set automatically on login)

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        emailVerified:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, email, role, createdAt]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        image:
          type: string
          format: uri
          nullable: true
      required: [name]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          description: "Min 8 chars, 1 uppercase, 1 number"
        confirmPassword:
          type: string
      required: [currentPassword, newPassword, confirmPassword]

    SetRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
      required: [role]

paths:
  # ── Auth.js managed endpoints ────────────────────────────────────────────────
  /api/auth/callback/credentials:
    post:
      tags: [auth]
      summary: Credentials sign-in
      description: |
        Processes email+password. Called internally by Auth.js.
        The server enforces emailVerified gate in authorize() regardless of call site.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        "302":
          description: Redirect to dashboard on success, sign-in on failure

  /api/auth/callback/google:
    get:
      tags: [auth]
      summary: Google OAuth callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to dashboard on success

  /api/auth/session:
    get:
      tags: [auth]
      summary: Get current session
      responses:
        "200":
          description: Session or null
          content:
            application/json:
              schema:
                oneOf:
                  - type: "null"
                  - type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                          role:
                            type: string
                            enum: [user, admin]
                      expires:
                        type: string
                        format: date-time

  /api/auth/signout:
    post:
      tags: [auth]
      summary: Sign out
      responses:
        "302":
          description: Redirect to login

  # ── User Profile ─────────────────────────────────────────────────────────────
  /api/users/me:
    get:
      tags: [users]
      summary: Get current user profile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

    patch:
      tags: [users]
      summary: Update profile (name + avatar)
      description: Validated against updateProfileSchema (Zod) — same schema as the Settings form.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated

  /api/users/me/password:
    post:
      tags: [users]
      summary: Change password
      description: Not available for OAuth-only accounts.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Current password incorrect or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated

  # ── Admin ────────────────────────────────────────────────────────────────────
  /api/admin/users:
    get:
      tags: [admin]
      summary: List all users
      description: Requires role=admin. Returns users ordered by createdAt.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient role

  /api/admin/users/{userId}/role:
    patch:
      tags: [admin]
      summary: Set user role
      description: Admins cannot change their own role.
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Cannot change own role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient role

  /api/admin/users/{userId}:
    delete:
      tags: [admin]
      summary: Delete user
      description: Permanently deletes the user (cascade). Admins cannot delete themselves.
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Cannot delete yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient role

  # ── Health ───────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [health]
      summary: Health check
      description: Returns 200 when the app is running. Used by smoke tests and uptime monitors.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time
