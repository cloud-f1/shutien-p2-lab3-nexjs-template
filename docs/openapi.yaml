# AUTO-GENERATED from Zod — do NOT hand-edit. Regenerate with `pnpm openapi:generate` (next-app/).
# Source of truth: next-app/lib/openapi/registry.ts + lib/validations/*. Drift-guarded in scripts/smoke.sh.
openapi: 3.1.0
info:
  title: AI App Template API
  version: 0.4.0
  description: Server Actions (actions/*.ts) are typed RPC — their contract is TypeScript + the shared Zod schemas in lib/validations, enforced at compile time; this OpenAPI documents the HTTP route-handler surface only. Auth.js routes under /api/auth/[...nextauth] are framework-owned and omitted. This file is GENERATED from Zod (the single source of truth) via `pnpm openapi:generate` — never hand-edit it; a smoke drift gate fails if it is stale.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: your-domain.com
tags:
  - name: health
    description: Health checks
  - name: billing
    description: Payment provider callbacks + cron jobs
  - name: cron
    description: CRON_SECRET-protected scheduled jobs
  - name: items
    description: Public REST API — API-key authenticated
  - name: analytics
    description: First-party sales-page funnel analytics (E334)
components:
  securitySchemes:
    cronBearer:
      type: http
      scheme: bearer
      description: "CRON_SECRET bearer token. Fails closed (401) when the secret is unset. Sent as `Authorization: Bearer <CRON_SECRET>`."
    apiKey:
      type: http
      scheme: bearer
      description: "E267 API key. Sent as `Authorization: Bearer sk_<prefix>_<secret>`. Resolves to the owning user; the key's scopes gate access (read → GET, write → POST). 401 if missing/invalid/revoked, 403 if the scope is absent."
  schemas:
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: "[A-Z]"
      required:
        - name
        - email
        - password
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        image:
          anyOf:
            - type: string
              format: uri
            - type: string
              enum:
                - ""
      required:
        - name
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          pattern: "[A-Z]"
        confirmPassword:
          type: string
          minLength: 1
      required:
        - currentPassword
        - newPassword
        - confirmPassword
    CreateItemInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - title
    UpdateItemInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - title
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - timestamp
    StripeWebhookAck:
      type: object
      properties:
        received:
          type: boolean
          enum:
            - true
        skipped:
          type: boolean
      required:
        - received
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    StripeEvent:
      type: object
      properties: {}
      additionalProperties: {}
      description: A Stripe.Event object — opaque to this contract.
    EcpayAck:
      type: string
      example: 1|OK
    EcpayCallback:
      type: object
      properties:
        MerchantTradeNo:
          type: string
        RtnCode:
          type: string
        CheckMacValue:
          type: string
      additionalProperties:
        type: string
    NewebPayCallback:
      type: object
      properties:
        Status:
          type: string
        MerchantID:
          type: string
        Version:
          type: string
        TradeInfo:
          type: string
        TradeSha:
          type: string
      additionalProperties:
        type: string
    CronOkResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
      additionalProperties: {}
      description: Cron job acknowledgement. Carries job-specific counters (e.g. checked / updated / flagged).
    CronErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          type: string
      required:
        - ok
        - error
    ReconcileErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          type: string
      required:
        - ok
        - error
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
        - updatedAt
    ItemListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
      required:
        - items
    ItemCreateResponse:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/Item"
      required:
        - item
    ItemsCsvExport:
      type: string
      description: "RFC-4180 CSV with columns: id, title, createdAt, updatedAt."
    CollectEventInput:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 255
        event:
          type: string
          enum:
            - page_view
            - cta_click
            - checkout_started
        utm:
          type: object
          properties:
            source:
              type:
                - string
                - "null"
              maxLength: 200
            medium:
              type:
                - string
                - "null"
              maxLength: 200
            campaign:
              type:
                - string
                - "null"
              maxLength: 200
      required:
        - slug
        - event
  parameters: {}
paths:
  /api/health:
    get:
      summary: Health check
      description: Returns 200 when the app is running. Used by smoke tests and uptime monitors.
      tags:
        - health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/billing/stripe/webhook:
    post:
      summary: Stripe webhook receiver
      description: Receives raw Stripe webhook events. Verifies the Stripe-Signature header, then processes the event idempotently. The raw provider event JSON is the request body.
      tags:
        - billing
      parameters:
        - schema:
            type: string
            description: Stripe webhook signature header
          required: true
          name: stripe-signature
          in: header
      requestBody:
        description: Raw Stripe event payload (verified by signature, not parsed by schema).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
      responses:
        "200":
          description: Event acknowledged (received, optionally skipped as a duplicate).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeWebhookAck"
        "400":
          description: Missing or invalid stripe-signature header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error — Stripe retries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/billing/ecpay/return:
    post:
      summary: ECPay ReturnURL — first authorization notification
      description: Receives the FIRST payment notification from ECPay after checkout. Verifies CheckMacValue, then upserts the subscription idempotently.
      tags:
        - billing
      requestBody:
        description: ECPay callback — application/x-www-form-urlencoded form with a CheckMacValue (SHA256). Verified, not schema-parsed.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EcpayCallback"
      responses:
        "200":
          description: ECPay acknowledgement string — exactly "1|OK".
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/EcpayAck"
        "400":
          description: Invalid CheckMacValue — "0|CheckMacValue invalid".
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Config or processing error — "0|Error" (ECPay retries).
          content:
            text/plain:
              schema:
                type: string
  /api/billing/ecpay/period:
    post:
      summary: ECPay PeriodReturnURL — recurring cycle notification
      description: Receives a RECURRING payment notification (2nd cycle onwards), once per successful billing cycle. Verifies CheckMacValue, then advances the subscription period idempotently.
      tags:
        - billing
      requestBody:
        description: ECPay callback — application/x-www-form-urlencoded form with a CheckMacValue (SHA256). Verified, not schema-parsed.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EcpayCallback"
      responses:
        "200":
          description: ECPay acknowledgement string — exactly "1|OK".
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/EcpayAck"
        "400":
          description: Invalid CheckMacValue — "0|CheckMacValue invalid".
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Config or processing error — "0|Error" (ECPay retries).
          content:
            text/plain:
              schema:
                type: string
  /api/billing/newebpay/return:
    post:
      summary: NewebPay 藍新 MPG notify (ReturnURL + NotifyURL)
      description: Receives the 藍新 MPG 幕前支付 notification (one-time purchase). Recomputes TradeSha (constant-time), AES-decrypts TradeInfo, then settles the matching order idempotently via settleOrder(). NewebPay only requires an HTTP 200 ack.
      tags:
        - billing
      requestBody:
        description: NewebPay MPG callback — application/x-www-form-urlencoded with an AES-256-CBC TradeInfo + SHA256 TradeSha. Verified, not schema-parsed.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NewebPayCallback"
      responses:
        "200":
          description: Acknowledged (settled or idempotent no-op).
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid TradeSha — "0|TradeSha invalid".
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Config or processing error — "0|Error" (NewebPay retries).
          content:
            text/plain:
              schema:
                type: string
  /api/billing/ecpay/renew:
    post:
      summary: ECPay 定期定額 renewal sweep (cron)
      description: Cron-callable. Flags ECPay subscriptions whose remaining periods fall below threshold so the UI prompts a rebuild (ECPay has no auto-renew after ExecTimes exhaustion). Requires the CRON_SECRET bearer token.
      tags:
        - billing
        - cron
      security:
        - cronBearer: []
      responses:
        "200":
          description: Sweep result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronOkResponse"
        "401":
          description: Missing or invalid CRON_SECRET bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Sweep error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronErrorResponse"
  /api/billing/reconcile:
    post:
      summary: Stripe subscription reconcile (cron)
      description: "Cron-callable drift recovery for a MISSED Stripe webhook: diffs stored subscriptions against Stripe's ground truth and repairs status / period-end / cancel-at. Requires the CRON_SECRET bearer token."
      tags:
        - billing
        - cron
      security:
        - cronBearer: []
      responses:
        "200":
          description: Reconcile result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronOkResponse"
        "401":
          description: Missing or invalid CRON_SECRET bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Reconcile error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileErrorResponse"
  /api/v1/items:
    get:
      summary: List the API key owner's items
      description: Lists the items owned by the user the API key resolves to (newest first). Requires the `read` scope. Bumps the key's lastUsedAt on success.
      tags:
        - items
      security:
        - apiKey: []
      responses:
        "200":
          description: The key owner's items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "401":
          description: Missing, malformed, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The API key lacks the required `read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create an item
      description: Creates an item owned by the user the API key resolves to. Requires the `write` scope. The body is validated by the shared CreateItemInput Zod schema. Bumps the key's lastUsedAt on success.
      tags:
        - items
      security:
        - apiKey: []
      requestBody:
        description: The item to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemInput"
      responses:
        "201":
          description: The created item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreateResponse"
        "400":
          description: Invalid JSON body or schema validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, malformed, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The API key lacks the required `write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/export/items:
    get:
      summary: Export the API key owner's items as CSV
      description: "Downloads all items owned by the user the API key resolves to as an RFC-4180 CSV file. Requires the `read` scope. Returns `Content-Disposition: attachment` so browsers trigger a file download. Bumps the key's lastUsedAt on success."
      tags:
        - items
      security:
        - apiKey: []
      responses:
        "200":
          description: CSV attachment of the key owner's items.
          content:
            text/csv:
              schema:
                $ref: "#/components/schemas/ItemsCsvExport"
        "401":
          description: Missing, malformed, invalid, or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The API key lacks the required `read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/analytics/collect:
    post:
      summary: Sales-page funnel beacon sink
      description: "Receives a navigator.sendBeacon POST from a /p/[slug] sales page and records ONE first-party funnel event (page_view | cta_click | checkout_started). Fire-and-forget: ALWAYS returns 204 (even on a malformed body) so a beacon never blocks page/checkout code. Stores NO PII — the client IP / User-Agent are used only to derive a day-scoped one-way session hash server-side and are never persisted; no cookie is read or set. The session hash is NOT accepted from the body."
      tags:
        - analytics
      requestBody:
        description: Funnel event payload (validated by the shared collectEventSchema).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectEventInput"
      responses:
        "204":
          description: Accepted (no content). Returned unconditionally — a rejected/malformed body is silently dropped so telemetry never affects the visitor.
webhooks: {}
