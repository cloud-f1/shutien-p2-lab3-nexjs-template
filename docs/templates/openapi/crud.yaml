# ============================================
# __RESOURCE__ Domain — OpenAPI CRUD Template
# ============================================
#
# 填空 CRUD 模板 — 替換佔位符即可產出合法的 OpenAPI 3.1 spec。
#
# 使用方式：
#   1. 全文搜尋替換所有 __佔位符__（見下方清單）
#   2. 新增或移除 properties 中的欄位
#   3. 將 paths 區塊拆分到 docs/openapi/paths/__RESOURCES_KEBAB__.yaml
#   4. 將 schemas 區塊拆分到 docs/openapi/schemas/__RESOURCE_LOWER__.yaml
#   5. 在 docs/openapi/openapi.yaml 入口加入 $ref（見底部「下一步」）
#
# 佔位符清單：
#   __RESOURCE__         PascalCase 單數   (e.g. Bookmark)
#   __RESOURCE_LOWER__   snake_case 單數   (e.g. bookmark)
#   __RESOURCES_KEBAB__  kebab-case 複數   (e.g. bookmarks)
#   __RESOURCES_LOWER__  snake_case 複數   (e.g. bookmarks)
#   __TAG__              OpenAPI tag 名稱  (e.g. bookmarks)
#   __FIELD_1__          第一個自訂欄位    (e.g. url)
#   __FIELD_1_TYPE__     第一個欄位型別    (e.g. string)
#   __FIELD_1_MAX__      第一個欄位最大長度 (e.g. 2000)
#   __FIELD_2__          第二個自訂欄位    (e.g. title)
#   __FIELD_2_TYPE__     第二個欄位型別    (e.g. string)
#   __FIELD_2_MAX__      第二個欄位最大長度 (e.g. 200)
#
# 注意：替換完佔位符後，此檔案即為合法的 OpenAPI 3.1 YAML paths + schemas。
# ============================================

# ─────────────────────────────────────────────
# Paths — 拆分後放入 docs/openapi/paths/__RESOURCES_KEBAB__.yaml
# ─────────────────────────────────────────────

collection:
  # POST /__RESOURCES_KEBAB__ — 建立資源
  post:
    tags: [__TAG__]
    summary: Create a __RESOURCE_LOWER__
    operationId: create__RESOURCE__
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/__RESOURCE_LOWER__.yaml#/__RESOURCE__Create'
    responses:
      '201':
        description: __RESOURCE__ created
        content:
          application/json:
            schema:
              $ref: '../schemas/__RESOURCE_LOWER__.yaml#/__RESOURCE__Read'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '422':
        $ref: '../schemas/common.yaml#/responses/ValidationError'

  # GET /__RESOURCES_KEBAB__ — 分頁列表
  get:
    tags: [__TAG__]
    summary: List current user's __RESOURCES_LOWER__ (paginated)
    operationId: list__RESOURCE__s
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    responses:
      '200':
        description: Paginated list of __RESOURCES_LOWER__
        content:
          application/json:
            schema:
              $ref: '../schemas/__RESOURCE_LOWER__.yaml#/Paginated__RESOURCE__Response'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'

item:
  # GET /__RESOURCES_KEBAB__/{__RESOURCE_LOWER___id} — 取得單筆
  get:
    tags: [__TAG__]
    summary: Get a __RESOURCE_LOWER__ by ID
    operationId: get__RESOURCE__
    parameters:
      - name: __RESOURCE_LOWER___id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: __RESOURCE__ details
        content:
          application/json:
            schema:
              $ref: '../schemas/__RESOURCE_LOWER__.yaml#/__RESOURCE__Read'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: __RESOURCE__ not found

  # PATCH /__RESOURCES_KEBAB__/{__RESOURCE_LOWER___id} — 部分更新
  patch:
    tags: [__TAG__]
    summary: Update a __RESOURCE_LOWER__
    operationId: update__RESOURCE__
    parameters:
      - name: __RESOURCE_LOWER___id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/__RESOURCE_LOWER__.yaml#/__RESOURCE__Update'
    responses:
      '200':
        description: __RESOURCE__ updated
        content:
          application/json:
            schema:
              $ref: '../schemas/__RESOURCE_LOWER__.yaml#/__RESOURCE__Read'
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: __RESOURCE__ not found
      '422':
        $ref: '../schemas/common.yaml#/responses/ValidationError'

  # DELETE /__RESOURCES_KEBAB__/{__RESOURCE_LOWER___id} — 刪除
  delete:
    tags: [__TAG__]
    summary: Delete a __RESOURCE_LOWER__
    operationId: delete__RESOURCE__
    parameters:
      - name: __RESOURCE_LOWER___id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: __RESOURCE__ deleted
      '401':
        $ref: '../schemas/common.yaml#/responses/Unauthorized'
      '404':
        description: __RESOURCE__ not found


# ─────────────────────────────────────────────
# Schemas — 拆分後放入 docs/openapi/schemas/__RESOURCE_LOWER__.yaml
# ─────────────────────────────────────────────

# 建立用 schema — 僅包含使用者需提供的欄位
__RESOURCE__Create:
  type: object
  required: [__FIELD_1__, __FIELD_2__]
  properties:
    __FIELD_1__:
      type: __FIELD_1_TYPE__
      maxLength: __FIELD_1_MAX__
    __FIELD_2__:
      type: __FIELD_2_TYPE__
      maxLength: __FIELD_2_MAX__
    # --- 在此新增更多欄位 ---
    # description:
    #   type: string
    #   maxLength: 2000

# 讀取用 schema — 包含 id、user_id、timestamps 等伺服器產生的欄位
__RESOURCE__Read:
  type: object
  required: [id, __FIELD_1__, __FIELD_2__, user_id, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    __FIELD_1__:
      type: __FIELD_1_TYPE__
    __FIELD_2__:
      type: __FIELD_2_TYPE__
    # --- 在此新增更多欄位（nullable 欄位使用 type 陣列） ---
    # description:
    #   type: ['string', 'null']
    user_id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# 更新用 schema — 所有欄位皆 optional（不設 required）
__RESOURCE__Update:
  type: object
  properties:
    __FIELD_1__:
      type: __FIELD_1_TYPE__
      maxLength: __FIELD_1_MAX__
    __FIELD_2__:
      type: __FIELD_2_TYPE__
      maxLength: __FIELD_2_MAX__
    # --- 在此新增更多欄位（nullable 欄位使用 type 陣列） ---
    # description:
    #   type: ['string', 'null']
    #   maxLength: 2000

# 分頁回應 — 包裝 items 陣列 + 分頁 metadata
Paginated__RESOURCE__Response:
  type: object
  required: [items, total, page, page_size, pages]
  properties:
    items:
      type: array
      items:
        $ref: '#/__RESOURCE__Read'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
    pages:
      type: integer


