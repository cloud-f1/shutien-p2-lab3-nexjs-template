name: task
fields:
  - name: title
    type: string
    required: true
    max_length: 200
  - name: description
    type: text
    required: false
    max_length: 2000
  - name: completed
    type: bool
    required: false
    default: false
  - name: due_date
    type: date
    required: false
  - name: priority
    type: int
    required: false
    default: 0
