  <text x="264" y="316" fill="#888" font-family="system-ui" font-size="11">Recent Activity</text>
  <text x="264" y="340" fill="#28c840" font-family="monospace" font-size="11">+ E45 auth endpoints — 86% coverage</text>
  <text x="264" y="360" fill="#28c840" font-family="monospace" font-size="11">+ @qa reviewed — LGTM</text>
  <text x="264" y="380" fill="#f0a500" font-family="monospace" font-size="11">~ E46 visual readme — in progress</text>

  <!-- Memory status card -->
  <rect x="716" y="208" width="224" height="180" rx="10" fill="#12121e" stroke="#1e1e30" stroke-width="1"/>
