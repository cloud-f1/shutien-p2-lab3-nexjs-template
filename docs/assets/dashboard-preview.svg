  <text x="44" y="164" fill="#666" font-family="system-ui" font-size="13">Projects</text>
  <text x="44" y="200" fill="#666" font-family="system-ui" font-size="13">Memory Hub</text>
  <text x="44" y="236" fill="#666" font-family="system-ui" font-size="13">Agent Activity</text>
  <text x="44" y="272" fill="#666" font-family="system-ui" font-size="13">Commands</text>
  <text x="44" y="308" fill="#666" font-family="system-ui" font-size="13">Settings</text>

  <!-- Main content area -->
  <!-- Page header -->
