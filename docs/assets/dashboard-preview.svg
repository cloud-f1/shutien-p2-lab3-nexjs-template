<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <!-- Window chrome -->
  <rect width="960" height="540" rx="12" fill="#07070f"/>
  <rect x="0" y="0" width="960" height="36" rx="12" fill="#0e0e1a"/>
