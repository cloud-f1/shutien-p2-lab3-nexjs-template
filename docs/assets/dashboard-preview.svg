  <!-- Tier 0 -->
  <rect x="736" y="252" width="184" height="24" rx="4" fill="#f0a500" opacity="0.08"/>
  <text x="748" y="269" fill="#f0a500" font-family="system-ui" font-size="10">Tier 0 — Global (8 files)</text>
  <!-- Arrow -->
  <text x="820" y="290" text-anchor="middle" fill="#444" font-family="system-ui" font-size="12">&#8593; promote</text>
  <!-- Tier 1 -->
  <rect x="736" y="300" width="184" height="24" rx="4" fill="#4a9eff" opacity="0.08"/>
  <text x="748" y="317" fill="#4a9eff" font-family="system-ui" font-size="10">Tier 1 — Project (8 files)</text>
