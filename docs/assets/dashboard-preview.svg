  <text x="260" y="170" fill="#f0a500" font-family="system-ui" font-weight="bold" font-size="28">3</text>

  <rect x="421" y="112" width="165" height="80" rx="10" fill="#12121e" stroke="#1e1e30" stroke-width="1"/>
