  <text x="437" y="170" fill="#28c840" font-family="system-ui" font-weight="bold" font-size="28">84%</text>

  <rect x="598" y="112" width="165" height="80" rx="10" fill="#12121e" stroke="#1e1e30" stroke-width="1"/>
  <text x="614" y="138" fill="#888" font-family="system-ui" font-size="11">AI Agents</text>
  <text x="614" y="170" fill="#7c6fff" font-family="system-ui" font-weight="bold" font-size="28">6</text>

  <rect x="775" y="112" width="165" height="80" rx="10" fill="#12121e" stroke="#1e1e30" stroke-width="1"/>
