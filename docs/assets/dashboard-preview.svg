  <rect x="264" y="256" width="80" height="32" rx="6" fill="#f0a500" opacity="0.15"/>
  <text x="282" y="277" fill="#f0a500" font-family="monospace" font-size="10">@spec</text>
  <line x1="344" y1="272" x2="360" y2="272" stroke="#333" stroke-width="1.5"/>
  <rect x="360" y="256" width="80" height="32" rx="6" fill="#28c840" opacity="0.15"/>
  <text x="380" y="277" fill="#28c840" font-family="monospace" font-size="10">@qa</text>
  <line x1="440" y1="272" x2="456" y2="272" stroke="#333" stroke-width="1.5"/>
  <rect x="456" y="256" width="80" height="32" rx="6" fill="#7c6fff" opacity="0.15"/>
  <text x="466" y="277" fill="#7c6fff" font-family="monospace" font-size="10">@deploy</text>
  <line x1="536" y1="272" x2="552" y2="272" stroke="#333" stroke-width="1.5"/>
  <rect x="552" y="256" width="80" height="32" rx="6" fill="#4a9eff" opacity="0.15"/>
  <text x="562" y="277" fill="#4a9eff" font-family="monospace" font-size="10">@memory</text>
