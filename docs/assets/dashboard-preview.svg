  <rect x="244" y="404" width="696" height="120" rx="10" fill="#12121e" stroke="#1e1e30" stroke-width="1"/>
  <text x="264" y="432" fill="#f0f0f8" font-family="system-ui" font-weight="bold" font-size="14">Quick Actions</text>
  <!-- Action buttons -->
  <rect x="264" y="448" width="130" height="56" rx="8" fill="#f0a500" opacity="0.1" stroke="#f0a500" stroke-opacity="0.3" stroke-width="1"/>
  <text x="329" y="472" text-anchor="middle" fill="#f0a500" font-family="system-ui" font-size="11">/athena:loop</text>
  <text x="329" y="490" text-anchor="middle" fill="#666" font-family="system-ui" font-size="9">Advance epic</text>

  <rect x="406" y="448" width="130" height="56" rx="8" fill="#7c6fff" opacity="0.1" stroke="#7c6fff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="471" y="472" text-anchor="middle" fill="#7c6fff" font-family="system-ui" font-size="11">/athena:spec</text>
  <text x="471" y="490" text-anchor="middle" fill="#666" font-family="system-ui" font-size="9">Design feature</text>

  <rect x="548" y="448" width="130" height="56" rx="8" fill="#28c840" opacity="0.1" stroke="#28c840" stroke-opacity="0.3" stroke-width="1"/>
  <text x="613" y="472" text-anchor="middle" fill="#28c840" font-family="system-ui" font-size="11">/athena:qa</text>
  <text x="613" y="490" text-anchor="middle" fill="#666" font-family="system-ui" font-size="9">Review + test</text>

  <rect x="690" y="448" width="130" height="56" rx="8" fill="#4a9eff" opacity="0.1" stroke="#4a9eff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="755" y="472" text-anchor="middle" fill="#4a9eff" font-family="system-ui" font-size="11">/athena:deploy</text>
  <text x="755" y="490" text-anchor="middle" fill="#666" font-family="system-ui" font-size="9">Ship to prod</text>
