  <text x="244" y="96" fill="#666" font-family="system-ui" font-size="12">Welcome back! Here is your project status.</text>

  <!-- Stat cards row -->
  <rect x="244" y="112" width="165" height="80" rx="10" fill="#12121e" stroke="#1e1e30" stroke-width="1"/>
