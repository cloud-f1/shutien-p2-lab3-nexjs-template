# One clean local stack for the Next.js app.
#
#   docker compose up --build -d         # start everything
#   docker compose down --remove-orphans # stop + clean up old/duplicate containers
#
# Services:
#   postgres  — Postgres 16 on host :5432 (SAME creds local `pnpm dev`/e2e use, so there is ONE db)
#   mailpit   — catches outbound email; SMTP :1025, web UI http://localhost:8025
#   migrate   — one-shot: runs drizzle migrations + seed, then exits
#   web       — the Next.js standalone server on http://localhost:3000
#
# Seeded logins:  admin@example.com / Admin123!  ·  editor@example.com / Editor123!  ·  viewer@example.com / Viewer123!

services:
  postgres:
    image: postgres:16-alpine
    # NO container_name — deliberately. Compose already namespaces containers by
    # PROJECT (the directory name), exactly as it namespaces volumes. Hardcoding a
    # name defeats that: the container becomes machine-wide while the volume stays
    # per-project, so whichever project starts first wins and serves ITS data to
    # everyone else — or the next `docker compose up` just fails on a name clash.
    #
    # This bit hard here. `nextapp_postgres` was owned by a FORK of this template
    # (both inherit this file), both used database `saas_dev`, and a third forked
    # project was on the same machine. The template's "dev database" was really the
    # fork's — carrying the fork's tables plus migrations from both products (17
    # applied against 15 repo .sql files), and missing `items` entirely.
    #
    # A template must never hardcode this: every fork inherits the same literal.
    # Reach containers with `docker compose exec postgres …`, not `docker exec <name>`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      POSTGRES_DB: saas_dev
    ports:
      # Overridable so a second project/worktree can run alongside this one:
      #   POSTGRES_PORT=5433 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nextapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
    environment:
      MP_MAX_MESSAGES: "500"

  migrate:
    build:
      context: ./next-app
      target: builder
    working_dir: /app
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgresql://saas_user:saas_pass@postgres:5432/saas_dev
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./next-app
      target: runner
      args:
        # Local demo: show the admin/editor/viewer quick-login buttons. Set "false"
        # for a real production build so the demo credentials never enter the bundle.
        NEXT_PUBLIC_ENABLE_DEMO_LOGIN: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://saas_user:saas_pass@postgres:5432/saas_dev
      AUTH_SECRET: local-docker-dev-secret
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: noreply@saas-dev.local
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  nextapp_pgdata:
