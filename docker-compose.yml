# Local full-stack run for the Next.js app + Postgres.
#
#   docker compose up --build -d
#
# Services:
#   postgres  — Postgres 16 (host port 5433 → avoid clash with saas_dev_postgres on 5432)
#   migrate   — one-shot: runs drizzle migrations + seed, then exits
#   web       — the Next.js standalone server on http://localhost:3000
#
# Logins seeded:  admin@example.com / Admin123!   and   user@example.com / User123!

services:
  postgres:
    image: postgres:16-alpine
    container_name: nextapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      # Host 5433 (5432 is taken by the dev container). Internal stays 5432.
      - "5433:5432"
    volumes:
      - nextapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./next-app
      target: builder
    container_name: nextapp_migrate
    working_dir: /app
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgresql://app:app_password@postgres:5432/app_db
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./next-app
      target: runner
    container_name: nextapp_web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app:app_password@postgres:5432/app_db
      AUTH_SECRET: local-docker-dev-secret
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  nextapp_pgdata:
