# Dev mode — hot-reload with source mounts
# Usage: docker compose up
# Optional: docker compose --profile mailpit up    (email UI at http://localhost:8025)
# Optional: docker compose --profile test up        (test-db on port 5433)
# Production: see docker-compose.prod.yml

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      POSTGRES_DB: saas_dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    profiles:
      - mailpit

  server:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./server:/app
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://saas_user:saas_pass@db:5432/saas_dev
      SECRET_KEY: docker-local-dev-secret-key-a1b2c3d4e5f6789012345678
      REFRESH_SECRET_KEY: docker-local-dev-refresh-key-a1b2c3d4e5f67890
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      EMAIL_PROVIDER: console
      EMAIL_FROM: noreply@example.com
      LOG_FORMAT: console
      DEBUG: "true"
      ENVIRONMENT: development
      ALLOWED_ORIGINS_STR: http://localhost:${CLIENT_PORT:-5173},https://client.ai-coding-template.orb.local
      RATE_LIMIT_AUTH: 5/minute
    command: >
      bash -c "pip install -q uv && uv sync &&
      for i in 1 2 3 4 5; do uv run alembic upgrade head && break || sleep 3; done &&
      uv run uvicorn app.main:app --reload --reload-dir /app/app --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${SERVER_PORT:-8080}
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 2s
      timeout: 3s
      retries: 5
    profiles:
      - test

volumes:
  pgdata:
  client_node_modules:
