# Dev services for next-app
#
# Start DB only:        docker compose up -d
# Start DB + mailpit:   docker compose --profile mailpit up -d
# Start test DB:        docker compose --profile test up -d
#
# Mailpit email UI:     http://localhost:8025
# Connection string:    postgresql://saas_user:saas_pass@localhost:5432/saas_dev

services:
  db:
    image: postgres:16-alpine
    container_name: saas_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      POSTGRES_DB: saas_dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: saas_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP — point SMTP_HOST=localhost SMTP_PORT=1025
      - "${MAILPIT_UI_PORT:-8025}:8025"      # Web UI
    profiles:
      - mailpit

  test-db:
    image: postgres:16-alpine
    container_name: saas_test_postgres
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 2s
      timeout: 3s
      retries: 5
    profiles:
      - test

volumes:
  pgdata:
