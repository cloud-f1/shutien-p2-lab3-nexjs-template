# One clean local stack for the Next.js app.
#
#   docker compose up --build -d         # start everything
#   docker compose down --remove-orphans # stop + clean up old/duplicate containers
#
# Services:
#   postgres  — Postgres 16 on host :5432 (SAME creds local `pnpm dev`/e2e use, so there is ONE db)
#   mailpit   — catches outbound email; SMTP :1025, web UI http://localhost:8025
#   migrate   — one-shot: runs drizzle migrations + seed, then exits
#   web       — the Next.js standalone server on http://localhost:3000
#
# Seeded logins:  admin@example.com / Admin123!  ·  editor@example.com / Editor123!  ·  viewer@example.com / Viewer123!

services:
  postgres:
    image: postgres:16-alpine
    # STACK_NAME makes every container name overridable so each git worktree can
    # run its own stack. Hardcoded names make the containers machine-wide
    # singletons: every worktree's `docker compose up` reuses ONE postgres, so
    # parallel epics migrate and seed the same databases against different branch
    # schemas. Default keeps the historical names, so nothing existing breaks.
    #   STACK_NAME=wt2 docker compose up -d   →  wt2_postgres, wt2_web, …
    container_name: ${STACK_NAME:-nextapp}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      POSTGRES_DB: saas_dev
    ports:
      - "5432:5432"
    volumes:
      - nextapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${STACK_NAME:-nextapp}_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: "500"

  migrate:
    build:
      context: ./next-app
      target: builder
    container_name: ${STACK_NAME:-nextapp}_migrate
    working_dir: /app
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgresql://saas_user:saas_pass@postgres:5432/saas_dev
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./next-app
      target: runner
      args:
        # Local demo: show the admin/editor/viewer quick-login buttons. Set "false"
        # for a real production build so the demo credentials never enter the bundle.
        NEXT_PUBLIC_ENABLE_DEMO_LOGIN: "true"
    container_name: ${STACK_NAME:-nextapp}_web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://saas_user:saas_pass@postgres:5432/saas_dev
      AUTH_SECRET: local-docker-dev-secret
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: noreply@saas-dev.local
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  nextapp_pgdata:
