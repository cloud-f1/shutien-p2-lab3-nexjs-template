name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this workflow only reads the repo (build/test/lint). It needs
# no write scopes on GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  quality:
    name: Quality (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          # packageManager lives in next-app/package.json (there is no root package.json),
          # so point the action there or it errors "No pnpm version is specified".
          package_json_file: next-app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholder env vars — lib/db.ts uses lazy-init (postgres client
          # connects on first query, not at import), so the build succeeds without a real DB.
          # Auth.js also only reads AUTH_SECRET at runtime, not build time.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: placeholder_secret_for_build_only_32chars

  db:
    name: DB (fresh-migrate gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_user
          POSTGRES_PASSWORD: saas_pass
          POSTGRES_DB: saas_dev
        options: >-
          --health-cmd "pg_isready -U saas_user -d saas_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          # packageManager lives in next-app/package.json (there is no root package.json),
          # so point the action there or it errors "No pnpm version is specified".
          package_json_file: next-app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fresh-DB migration gate
        run: pnpm db:test-migrate
        env:
          # Points at the Postgres service container above.
          # test-migrate.ts connects to the `postgres` maintenance DB first (via withDatabase),
          # creates a throwaway test DB, runs drizzle-kit migrate, asserts tables, then drops it.
          DATABASE_URL: postgresql://saas_user:saas_pass@localhost:5432/saas_dev

  docs:
    name: Docs & identity (staleness · dev-docs build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Gate the audit's brand/identity-staleness check (old repo slug / org / email
      # demo-logins surviving in live docs). No deps — pure git grep, runs in seconds.
      - name: Staleness check
        run: bash scripts/staleness-check.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          package_json_file: dev-docs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dev-docs/pnpm-lock.yaml

      # PRs don't otherwise build the user manual (deploy-docs.yml only runs on main) —
      # this catches a broken VitePress build / dead link before merge.
      - name: Build dev-docs
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: dev-docs
