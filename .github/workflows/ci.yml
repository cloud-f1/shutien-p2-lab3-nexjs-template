name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholder env vars — lib/db.ts uses lazy-init (postgres client
          # connects on first query, not at import), so the build succeeds without a real DB.
          # Auth.js also only reads AUTH_SECRET at runtime, not build time.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: placeholder_secret_for_build_only_32chars

  db:
    name: DB (fresh-migrate gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_user
          POSTGRES_PASSWORD: saas_pass
          POSTGRES_DB: saas_dev
        options: >-
          --health-cmd "pg_isready -U saas_user -d saas_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fresh-DB migration gate
        run: pnpm db:test-migrate
        env:
          # Points at the Postgres service container above.
          # test-migrate.ts connects to the `postgres` maintenance DB first (via withDatabase),
          # creates a throwaway test DB, runs drizzle-kit migrate, asserts tables, then drops it.
          DATABASE_URL: postgresql://saas_user:saas_pass@localhost:5432/saas_dev
